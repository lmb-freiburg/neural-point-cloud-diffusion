train_dataset: SRNChairsTrain

model:
    n_obj: 4610
    coords_dim: 3
    feats_dim: 32
    num_points: 512
    use_view_dir: False
    max_shading_pts: 70
    width: 1024
    layers: 23
    heads: 16

pointnerf_training:
    batch_size: 8
    max_epochs: 7500
    base_learning_rate: 1.e-3

diffusion_training:
    batch_size: 32
    max_iterations: 1800000
    base_learning_rate: 4.e-5
    weight_decay: 0.01
    use_ema: True
    grad_clip_max_norm: 0.35
    grad_clip_warmup: 10000
    ema_params:
        - !!python/tuple [1, 0.9999, 0.9999, False]

diffusion_evaluation:
    num_samples: 1000
    poses_path: data/srnchairs_test_poses.npy
    intrinsics_path: data/srnchairs_test_intrinsics.npy
    inception_pkl_path: data/chairs_test_inception_stylegan.pkl